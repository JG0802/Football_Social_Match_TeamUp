<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 정보</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            gap: 20px;
        }

        .box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
            display: flex;
            flex-direction: column;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .info {
            padding-top: 20px;
            border-top: 2px solid #ced4da;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info label {
            width: 100%;
            font-size: 14px;
            color: #555;
        }

        input:disabled {
            background-color: #e9ecef; /* 비활성화 시 연한 회색 */
            color: #6c757d; /* 비활성화 시 텍스트 색상 */
            border: 1px solid #ced4da; /* 비활성화 시 테두리 색상 */
            cursor: not-allowed; /* 마우스 커서 변경 */
        }

        select, input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        input {
            width: 278px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background-color: #0056b3;
        }

        .logout-btn {
            margin-top: 35px;
            background-color: #FF4C4C;
        }

        .logout-btn:hover {
            background-color: #cc3b3b;
        }

        .invite-section {
            border-top: 2px solid #ced4da;
            padding-top: 20px;
        }

        .invite-section h3 {
            text-align: center;
            margin-bottom: 10px;
            margin-top: 0;
        }

        .invite-section label {
            font-size: 14px;
            margin: 5px 0;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 회원 정보 박스 -->
        <div class="box">
            <h2>회원 정보</h2>
            <div class="info">
                <label for="memberUsername">사용자 이름 (아이디)</label>
                <input type="text" id="memberUsername" disabled>

                <label for="position1">선호 포지션 1</label>
                <input type="text" id="position1" disabled>

                <label for="position2">선호 포지션 2</label>
                <input type="text" id="position2" disabled>

                <label for="position3">선호 포지션 3</label>
                <input type="text" id="position3" disabled>
            </div>
            <button class="logout-btn" onclick="logout()">로그아웃</button>
        </div>

        <!-- 팀 구성 및 입력 박스 -->
        <div class="box">
            <h2>팀 구성</h2>
            <div class="invite-section">
                <h3>생성할 팀명</h3>
                <div class="formation-section">
                    <label for="formationSelect">포메이션:</label>
                    <select id="formationSelect">
                        <option value="442">4-4-2</option>
                        <option value="4231">4-2-3-1</option>
                        <option value="433">4-3-3</option>
                        <option value="352">3-5-2</option>
                        <option value="343">3-4-3</option>
                    </select>
                </div>
            
                <input type="text" id="inviteCodeInput" placeholder="생성할 팀 이름을 입력해주세요!">
                <button onclick="createInviteCode()">팀 생성</button>
            </div>
            <div style="height: 33.5px;"></div>

            <div class="invite-section">
                <h3>초대받은 팀에 접속</h3>
                <label for="formationSelect">참여 중인 팀 선택:</label>
                <div id="team-section"></div>
                <input type="text" id="joinInviteCodeInput" placeholder="초대받은 팀의 이름을 입력하세요!">
                <button onclick="joinInviteCode()" class="button-spacing">팀 참여</button>
            </div>
        </div>
    </div>

    <script>
        const userData = JSON.parse(localStorage.getItem('userData'));

        if (!userData) {
            alert('로그인이 필요합니다.');
            window.location.href = 'index.html';
        } else {
            document.getElementById('memberUsername').value = userData.username;
            document.getElementById('position1').value = userData.positions[0];
            document.getElementById('position2').value = userData.positions[1];
            document.getElementById('position3').value = userData.positions[2];

            const selectedFormation = userData.formation || '442';
            document.getElementById('formationSelect').value = selectedFormation;
        }

        document.getElementById('formationSelect').addEventListener('change', (event) => {
            const selectedFormation = event.target.value;
            userData.formation = selectedFormation;
            localStorage.setItem('userData', JSON.stringify(userData));
        });
        
        function redirectToFormationPage(formation) {
            if (formation === "442") {
                window.location.href = "stadium442.html";
            } else if (formation === "4231") {
                window.location.href = "stadium4231.html";
            } else if (formation === "433") {
                window.location.href = "stadium433.html";
            } else if (formation === "352") {
                window.location.href = "stadium352.html";
            } else if (formation === "343") {
                window.location.href = "stadium343.html";
            } else {
                alert("지원하지 않는 포메이션입니다.");
            }
        }

        function createInviteCode() {
            const inviteCode = document.getElementById('inviteCodeInput').value;
            const username = userData.username;
            const formation = document.getElementById('formationSelect').value;
    
            if (!inviteCode) {
                alert('생성할 팀 이름을 입력하세요.');
                return;
            }
    
            userData.inviteCode = inviteCode;
            localStorage.setItem('userData', JSON.stringify(userData));
    
            fetch('http://localhost:4000/invite/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ inviteCode, formation, username }),
            })
                .then(response => {
                    if (response.ok) {
                        alert('팀이 생성되었습니다.');
                        redirectToFormationPage(formation);
                    } else {
                        response.text().then(text => {
                            alert(text);
                        });
                    }
                })
                .catch(error => {
                    console.error('팀 생성 중 오류:', error);
                    alert('팀 생성 중 문제가 발생했습니다.');
                });
        }

        function loadUserInviteCodes() {
            const username = userData.username;
    
            fetch('http://localhost:4000/invite/user-codes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username }),
            })
                .then(response => response.json())
                .then(data => {
                    const teamSection = document.getElementById('team-section');
                    teamSection.innerHTML = ''; // 초기화
    
                    if (data.success && data.inviteCodes.length > 0) {
                        const dropdown = document.createElement('select');
                        dropdown.id = 'teamDropdown';
                        dropdown.style.marginBottom = '15px';
                        dropdown.addEventListener('change', handleDropdownChange);
    
                        const defaultOption = document.createElement('option');
                        defaultOption.value = 'new';
                        defaultOption.textContent = '[새로운 팀 참여 시 아래에 팀명 입력]';
                        dropdown.appendChild(defaultOption);
    
                        data.inviteCodes.forEach(code => {
                            const option = document.createElement('option');
                            option.value = code;
                            option.textContent = code;
                            dropdown.appendChild(option);
                        });
    
                        teamSection.appendChild(dropdown);
                    } else {
                        const noTeamMessage = document.createElement('input');
                        noTeamMessage.placeholder = '당신은 참여 중인 팀이 없습니다!';
                        noTeamMessage.style.border = 'none';
                        noTeamMessage.style.marginTop = '8.5px';
                        noTeamMessage.style.marginBottom = '10px';
                        noTeamMessage.style.fontSize = '16px'; // 글자 크기
                        noTeamMessage.style.fontWeight = 'bold'; // 글자 굵기
                        noTeamMessage.style.textAlign = 'center'; // 가운데 정렬
                        teamSection.appendChild(noTeamMessage);
                    }
                })
                .catch(error => console.error('팀 목록 로드 중 오류:', error));
        }

        function handleDropdownChange(event) {
            const inputField = document.getElementById('joinInviteCodeInput');
            if (event.target.value === 'new') {
                inputField.disabled = false; // 입력란 활성화
                inputField.placeholder = '초대받은 팀의 이름을 입력하세요!'; // placeholder 변경
            } else {
                inputField.disabled = true; // 입력란 비활성화
                inputField.value = ''; // 비활성화 시 입력란 초기화
                inputField.placeholder = '참여 중인 팀을 이미 선택하셨습니다.'; // placeholder 변경
            }
        }

        function joinInviteCode() {
            const dropdown = document.getElementById('teamDropdown');
            const inviteCode = dropdown && dropdown.value !== 'new'
                ? dropdown.value
                : document.getElementById('joinInviteCodeInput').value;
    
            if (!inviteCode) {
                alert('참여할 팀 이름을 입력하세요.');
                return;
            }
    
            const username = userData.username;
            userData.inviteCode = inviteCode;
            localStorage.setItem('userData', JSON.stringify(userData));
    
            fetch('http://localhost:4000/invite/join', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ inviteCode, username }),
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const formation = data.formation;
                        redirectToFormationPage(formation);
                    } else {
                        alert('팀이 존재하지 않습니다.');
                    }
                })
                .catch(error => {
                    console.error('팀 참여 중 오류:', error);
                    alert('팀 참여 중 문제가 발생했습니다.');
                });
        }

        function logout() {
            localStorage.removeItem('userData');
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadUserInviteCodes();
        });
    </script>
</body>
</html>
